server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy /api requests to the Medkit Gateway
    # Note: Using http://host.docker.internal:8080 assumes the gateway is running on the host network.
    # In production, this can be an environment variable substituted at runtime or a docker-compose service name.
    location /api/ {
        # You can change the proxy_pass URL based on deployment
        proxy_pass http://host.docker.internal:8080/api/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # SSE Support
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Connection "keep-alive";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy WebSocket fallback if ever added to Medkit
    location /ws {
        proxy_pass http://host.docker.internal:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Support for React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
